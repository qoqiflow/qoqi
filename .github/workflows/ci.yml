name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatting of the Go code
        run: test -z "$(gofmt -l cmd internal test pkg)" || (gofmt -l cmd internal test pkg; exit 1)
      - name: Build
        run: make build
      - name: Formatting of the Qoqi code
        run: ./qoqi fmt --check internal/stdlib/lib examples
      - name: Tests
        run: make test

  sdk:
    name: SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite
      - name: The Keepers, on SQLite
        run: make sdk-check

  console:
    name: Console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Typecheck and test
        run: make console-check

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # arch is what the machine calls itself (uname -m), goarch what Go does
        include:
          - { goos: linux, goarch: amd64, arch: x86_64 }
          - { goos: linux, goarch: arm64, arch: arm64 }
          - { goos: darwin, goarch: amd64, arch: x86_64 }
          - { goos: darwin, goarch: arm64, arch: arm64 }
          - { goos: windows, goarch: amd64, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /tmp/qoqi ./cmd/qoqi
